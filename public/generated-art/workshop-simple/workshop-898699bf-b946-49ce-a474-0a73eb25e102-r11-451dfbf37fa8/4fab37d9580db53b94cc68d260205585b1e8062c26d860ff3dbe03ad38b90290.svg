<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="scene-title scene-description"><title id="scene-title">阁楼铜匙</title><desc id="scene-description">旧剧场阁楼的斜顶与木梁压低空间，尘埃般的暖光落在油漆桶和铜匙上；人物躲在梁柱后的暗处，远处手电光切过走廊。</desc><rect width="1600" height="900" fill="#302a27"/><rect x="0" y="0" width="1600" height="900" rx="0" fill="#302a27" stroke="none" stroke-width="0" opacity="1"/><polygon points="0,220 440,0 1160,0 1600,220 1600,900 0,900" fill="#594a3d" stroke="#806b54" stroke-width="5" opacity="1"/><rect x="0" y="620" width="1600" height="150" rx="0" fill="#1b1a1a" stroke="#8a765e" stroke-width="4" opacity="1"/><rect x="270" y="0" width="80" height="480" rx="0" fill="#191b1c" stroke="#735e4c" stroke-width="8" opacity="1"/><rect x="1250" y="0" width="80" height="480" rx="0" fill="#191b1c" stroke="#735e4c" stroke-width="8" opacity="1"/><rect x="590" y="600" width="170" height="170" rx="12" fill="#b58a4c" stroke="#d3a969" stroke-width="3" opacity="1"/><ellipse cx="650" cy="470" rx="35" ry="42" fill="#19191a" stroke="none" stroke-width="0" opacity="1"/><polygon points="610,512 690,512 740,650 570,650" fill="#19191a" stroke="none" stroke-width="0" opacity="1"/><ellipse cx="805" cy="295" rx="13" ry="38" fill="#bd9650" stroke="#ead087" stroke-width="3" opacity="1"/><polygon points="810,330 710,650 900,650" fill="#e5c878" stroke="none" stroke-width="0" opacity="0.85"/><rect x="1020" y="250" width="370" height="16" rx="0" fill="#d5d9cb" stroke="none" stroke-width="0" opacity="0.75"/><rect x="1080" y="320" width="250" height="16" rx="0" fill="#d5d9cb" stroke="none" stroke-width="0" opacity="0.55"/><rect x="0" y="780" width="1600" height="20" rx="0" fill="#8c704e" stroke="none" stroke-width="0" opacity="1"/><line x1="50" y1="780" x2="1550" y2="780" stroke="#b39468" stroke-width="3" opacity="0.5"/></svg>