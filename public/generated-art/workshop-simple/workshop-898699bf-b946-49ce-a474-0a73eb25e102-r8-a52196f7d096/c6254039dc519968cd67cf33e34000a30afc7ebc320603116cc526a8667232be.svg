<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="scene-title scene-description"><title id="scene-title">现场 1</title><desc id="scene-description">回答中的现实现场，此刻。你翻开第二页。你握紧记录本，眼前的选择必须回应原问题。记录中的原文写着：“影视和音乐资源多，机会多，最早北漂实际上是在北影门口有爬活儿的电影演员和在胡同里蜗居的野生音乐人的专有名次。他们不想体制内进京，好歹一个小”</desc><rect width="1600" height="900" fill="#c511ce"/><rect x="0" y="510" width="1600" height="390" rx="0" fill="#ce7b25" stroke="none" stroke-width="0" opacity="1"/><ellipse cx="1160" cy="215" rx="120" ry="120" fill="#8e4ecb" stroke="none" stroke-width="0" opacity="0.78"/><polygon points="0,570 320,318 660,570" fill="#b3ce2a" stroke="#e1091b" stroke-width="4" opacity="0.92"/><polygon points="520,570 900,262 1320,570" fill="#1b840d" stroke="#02dbc3" stroke-width="4" opacity="0.86"/><rect x="722" y="390" width="260" height="180" rx="12" fill="#3d697b" stroke="#d5fba9" stroke-width="6" opacity="0.96"/><line x1="852" y1="390" x2="852" y2="570" stroke="#176dda" stroke-width="6" opacity="0.94"/></svg>