<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="scene-title scene-description"><title id="scene-title">现场 1</title><desc id="scene-description">回答中的现实现场，此刻。你翻开第二页。你握紧记录本，眼前的选择必须回应原问题。记录中的原文写着：“G回退可以保留原文线索并生成可玩的故事。这是一篇足够长的回答，用于验证本地SVG回退可以保留原文线索并生成可玩的故事。”</desc><rect width="1600" height="900" fill="#97a568"/><rect x="0" y="510" width="1600" height="390" rx="0" fill="#683615" stroke="none" stroke-width="0" opacity="1"/><ellipse cx="1160" cy="215" rx="120" ry="120" fill="#565dd6" stroke="none" stroke-width="0" opacity="0.78"/><polygon points="0,570 320,318 660,570" fill="#f24f2c" stroke="#4266dd" stroke-width="4" opacity="0.92"/><polygon points="520,570 900,262 1320,570" fill="#63471b" stroke="#5a6a61" stroke-width="4" opacity="0.86"/><rect x="722" y="390" width="260" height="180" rx="12" fill="#ecefe2" stroke="#08d974" stroke-width="6" opacity="0.96"/><line x1="852" y1="390" x2="852" y2="570" stroke="#de7a27" stroke-width="6" opacity="0.94"/></svg>