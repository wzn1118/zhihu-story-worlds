<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>重生周 · 导出旧存档</title><style>body{max-width:680px;margin:70px auto;padding:24px;background:#141113;color:#eee;font:18px/1.8 system-ui}button{padding:14px 24px;background:#bb263b;color:white;border:0;font:inherit;cursor:pointer}pre{white-space:pre-wrap;color:#cbb}</style><h1>把重生周进度带到赤页</h1><p>请在原来游玩重生周的浏览器和启动地址打开此页，再导出存档。</p><p>随后在赤页“我的存档 → 导入重生周存档”中选择文件。</p><button id="export">导出主线进度与结局</button><pre id="status"></pre><script>
document.querySelector('#export').onclick=()=>{const status=document.querySelector('#status');try{const raw=localStorage.getItem('doomsday-45-degree-save-v2');if(!raw)throw new Error('此地址下未找到主线存档，请确认使用了原来的浏览器和端口。');const value={format:'redrain-legacy-save',version:1,experienceId:'redrain-rebirth-week',contentVersion:'20260910',savedAt:Date.now(),state:JSON.parse(raw),endings:JSON.parse(localStorage.getItem('doomsday-45-degree-endings-v2')||'[]')};const a=document.createElement('a');const url=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'}));a.href=url;a.download='重生周-旧版存档.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);status.textContent='已准备导出文件；原存档保持不变。'}catch(e){status.textContent=e.message}};
</script></html>
